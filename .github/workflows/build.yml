# Builds and tests every push and pull request.
# Pushing a tag like v1.2.0 (matching mod_version in gradle.properties) also publishes a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      jar: ${{ steps.jar.outputs.name }}
      version: ${{ steps.jar.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew build

      - name: Name the release JAR
        id: jar
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          name="kotoba-keep-$version+$minecraft.jar"
          mkdir dist
          cp "build/libs/kotoba-keep-$version.jar" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotoba-keep
          path: dist/
          if-no-files-found: error

  # Separate job so the build (and its dependencies) never runs with write access.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kotoba-keep
          path: dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          JAR: ${{ needs.build.outputs.jar }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match mod_version $VERSION in gradle.properties"
            exit 1
          fi
          gh release create "$TAG" "dist/$JAR" "dist/$JAR.sha256" \
            --title "Kotoba Keep $VERSION" --notes-file .github/release-notes.md --generate-notes --verify-tag
